name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Build and start
        run: docker compose up -d --build
      - name: Wait for healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' chronos-mcp)
            [ "$status" = healthy ] && exit 0
            sleep 1
          done
          docker compose logs
          exit 1
      - name: Check /health and a tool call
        run: |
          curl -fsS http://127.0.0.1:8765/health
          curl -fsS http://127.0.0.1:8765/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"get_current_time","arguments":{"timezone":"UTC"}}}' \
            | grep -q '"isError":false'
      - name: Check image size
        run: |
          size=$(docker image inspect chronos-mcp:1.0.0 --format '{{.Size}}')
          echo "Image size: $((size / 1000000)) MB"
          [ "$size" -lt 150000000 ]
      - if: always()
        run: docker compose down
